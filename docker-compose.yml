services:
  # --- M1: object storage + relational catalog store -----------------------

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: geo-seaweedfs
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=1024
      -filer
      -s3
      -s3.config=/etc/seaweedfs/s3.json
      -s3.port=8333
      -ip.bind=0.0.0.0
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master
      - "8888:8888" # filer
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  seaweedfs-init:
    image: amazon/aws-cli:2.17.62
    container_name: geo-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-platform}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/seaweedfs/init-buckets.sh:/scripts/init-buckets.sh:ro
    networks: [platform]

  postgres:
    image: postgis/postgis:16-3.4
    container_name: geo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}
      POSTGRES_DB: platform
      # lakekeeper isn't in the master prompt's §4 database list (pgstac,
      # dagster, cube, platform) but Lakekeeper needs its own Postgres-backed
      # catalog metadata store to run at all — added here rather than as a
      # new service, since it's just another database on the one Postgres
      # instance already planned. See docs/adr/0002.
      POSTGRES_MULTIPLE_DATABASES: pgstac,dagster,cube,platform,lakekeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [platform]

  # --- M2: Iceberg catalog + orchestration + notebook -----------------------

  # Lakekeeper's own CLI: "The database must be migrated before running the
  # server" — a one-shot job the master prompt's example command didn't
  # mention. Found via `docker run quay.io/lakekeeper/catalog:v0.11.1 --help`
  # after `serve` failed with "relation \"server\" does not exist".
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.11.1
    container_name: geo-lakekeeper-migrate
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-lakekeeper-dev-encryption-key-please-rotate}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}@postgres:5432/lakekeeper
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.11.1
    container_name: geo-lakekeeper
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-lakekeeper-dev-encryption-key-please-rotate}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}@postgres:5432/lakekeeper
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  lakekeeper-init:
    image: curlimages/curl:8.10.1
    container_name: geo-lakekeeper-init
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/init-lakekeeper.sh"]
    volumes:
      - ./infra/lakekeeper/init-lakekeeper.sh:/scripts/init-lakekeeper.sh:ro
      - ./infra/lakekeeper/create-default-warehouse.json:/scripts/create-default-warehouse.json:ro
    networks: [platform]

  dagster:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: geo-dagster
    environment:
      DAGSTER_PG_USERNAME: ${POSTGRES_USER:-platform}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}
      LAKEKEEPER_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: poc
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-platform}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      STAC_API_URL: http://stac-api:8080
      TERRIA_INIT_DIR: /opt/dagster/app/terria-init
      GEE_SERVICE_ACCOUNT_KEY: /secrets/gee-sa-key.json
      EE_PROJECT_ID: ${EE_PROJECT_ID:-}
    ports:
      - "3000:3000"
    volumes:
      - terria_init:/opt/dagster/app/terria-init
      - ${GEE_KEY_FILE:-/dev/null}:/secrets/gee-sa-key.json:ro
      - ${EE_CONFIG_DIR:-/dev/null}:/root/.config/earthengine:ro
    depends_on:
      postgres:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

  # --- M4: raster catalog + dynamic tiling -----------------------------------

  # ghcr.io/stac-utils/pgstac is a full postgres server image with pgstac's
  # migrations baked into its own initdb, not a standalone migration CLI —
  # useless for bolting pgstac onto our already-running shared postgres.
  # `pypgstac` is a plain PyPI package instead: install it and run its
  # `migrate` command against our postgres directly.
  pgstac-init:
    image: python:3.12-slim
    container_name: geo-pgstac-init
    command: ["sh", "-c", "pip install --no-cache-dir 'pypgstac[psycopg]==0.9.5' && pypgstac migrate"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}
      PGDATABASE: pgstac
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]

  stac-api:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:3.0.0
    container_name: geo-stac-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-platform-dev-secret-please-rotate}
      POSTGRES_DBNAME: pgstac
      POSTGRES_HOST_READER: postgres
      POSTGRES_HOST_WRITER: postgres
      POSTGRES_PORT: "5432"
      APP_HOST: 0.0.0.0
      APP_PORT: "8081"
      ENVIRONMENT: local
      RELOAD: "false"
    ports:
      - "8081:8080" # image's uvicorn ignores APP_PORT and always binds 8080
    depends_on:
      postgres:
        condition: service_healthy
      pgstac-init:
        condition: service_completed_successfully
    healthcheck:
      # no curl/wget in this image; it does have python3
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/collections')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: geo-titiler
    environment:
      AWS_S3_ENDPOINT: seaweedfs:8333
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-platform}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.TIF,.tiff"
    ports:
      - "8082:80" # image's gunicorn listens on 80, not the 8000 its own docs assume
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  # --- M5: semantic layer, BFF, auth -----------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: geo-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8083"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8083:8083"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [platform]

  cube:
    image: cubejs/cube:v0.36
    container_name: geo-cube
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: duckdb
      CUBEJS_DB_DUCKDB_DATABASE_PATH: ":memory:"
      CUBEJS_DB_DUCKDB_S3_ENDPOINT: seaweedfs:8333
      CUBEJS_DB_DUCKDB_S3_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-platform}
      CUBEJS_DB_DUCKDB_S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      CUBEJS_DB_DUCKDB_S3_REGION: us-east-1
      CUBEJS_DB_DUCKDB_S3_USE_SSL: "false"
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-cube-dev-secret-please-rotate}
      CUBEJS_EXTERNAL_DEFAULT: "true"
      CUBEJS_SCHEMA_PATH: model
    ports:
      - "4000:4000"
    volumes:
      - ./semantic/cube.js:/cube/conf/cube.js:ro
      - ./semantic/cubes/ndvi_zonal_stats.yml:/cube/conf/model/ndvi_zonal_stats.yml:ro
      - ./semantic/views/commune_overview.yml:/cube/conf/model/commune_overview.yml:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/readyz',r=>{r.statusCode===200?process.exit(0):process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [platform]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: geo-api
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBE_API_SECRET: ${CUBE_API_SECRET:-cube-dev-secret-please-rotate}
      STAC_API_URL: http://stac-api:8080
      KEYCLOAK_URL: http://keycloak:8083
      KEYCLOAK_REALM: geodata
      KEYCLOAK_CLIENT_ID: platform-bff
      KEYCLOAK_CLIENT_SECRET: bff-dev-secret
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-platform}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      LAKEKEEPER_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: poc
      TITILER_URL: http://titiler:80
    ports:
      - "8000:8000"
    depends_on:
      cube:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  # --- M6: portal front-end ---------------------------------------------------

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: geo-portal
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  # --- M7: TerriaMap -----------------------------------------------------------

  terria-init:
    image: busybox:1.36
    container_name: geo-terria-init
    command: ["sh", "-c", "cp -n /seed/*.json /init/ 2>/dev/null; ls /init/"]
    volumes:
      - ./infra/terria/init:/seed:ro
      - terria_init:/init
    networks: [platform]

  terria:
    build:
      context: .
      dockerfile: infra/terria/Dockerfile
    container_name: geo-terria
    ports:
      - "3001:3001"
    volumes:
      - ./infra/terria/serverconfig.json:/app/serverconfig.json:ro
      - ./infra/terria/config.json:/app/wwwroot/config.json:ro
      - ./infra/terria/regionMapping.json:/app/wwwroot/data/regionMapping.json:ro
      - terria_init:/app/wwwroot/init
    depends_on:
      seaweedfs:
        condition: service_healthy
      terria-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001',r=>{r.statusCode===200?process.exit(0):process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [platform]

  jupyter:
    build:
      context: ./infra/jupyter
    container_name: geo-jupyter
    ports:
      - "8890:8888" # 8888 is already used by the seaweedfs filer on the host
    volumes:
      - ./notebooks:/home/jovyan/notebooks
    environment:
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-platform}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-platform-dev-secret-please-rotate}
      LAKEKEEPER_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: poc
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform]

volumes:
  seaweedfs_data:
  postgres_data:
  terria_init:

networks:
  platform:
    driver: bridge
