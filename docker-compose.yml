version: "3.8"

services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: geodata-nifi
    ports:
      - "8080:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - ./nifi/data:/opt/nifi/data
    restart: unless-stopped

  # Google Earth Engine n'a pas de connecteur natif dans NiFi : ce petit service
  # exécute périodiquement le script Python d'export NDVI et dépose le résultat
  # dans ./nifi/data/gee, que NiFi surveille ensuite (ListFile/FetchFile).
  gee-exporter:
    build:
      context: ./nifi/scripts
    container_name: geodata-gee-exporter
    environment:
      - EE_PROJECT_ID=${EE_PROJECT_ID}
      - INTERVAL_HOURS=${GEE_INTERVAL_HOURS:-24}
      - LOOKBACK_DAYS=${GEE_LOOKBACK_DAYS:-14}
    volumes:
      - ${EE_CONFIG_DIR}:/root/.config/earthengine:ro
      - ./nifi/data/gee:/data/gee
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_HOSTNAME: localhost
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-postgres
    networks:
      - keycloak-network

volumes:
  nifi_conf:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
  keycloak_postgres_data:

networks:
  keycloak-network:
    driver: bridge
