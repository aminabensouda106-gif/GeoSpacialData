server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # nginx resolves proxy_pass hostnames once, at config-load time, and
    # caches the IP forever — fine for a static upstream, but Docker
    # reassigns container IPs on every recreate. Any service that gets
    # `docker compose up -d <service>`'d while portal stays running (e.g.
    # rebuilding terria to pick up an image change) ends up unreachable
    # ("Host is unreachable") until portal itself is restarted. Using
    # Docker's embedded DNS as an explicit resolver, with the upstream
    # host in a variable, forces nginx to re-resolve per the TTL below
    # instead of caching indefinitely.
    #
    # Caveat: once proxy_pass's target uses a variable, nginx stops doing
    # its usual "strip the matched location prefix" URI rewriting (that
    # behavior requires the target to be resolvable at config-parse time).
    # Each location below is therefore a regex location that captures
    # everything after its prefix into a named group and rebuilds the
    # upstream path explicitly, rather than relying on the implicit
    # prefix-stripping a plain `location /x/ { proxy_pass http://host/; }`
    # would normally do.

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/(?<path>.*)$ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tiles/(?<path>.*)$ {
        set $upstream_seaweedfs seaweedfs:8333;
        proxy_pass http://$upstream_seaweedfs/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/terria/(?<path>.*)$ {
        set $upstream_terria terria:3001;
        proxy_pass http://$upstream_terria/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TerriaMap's index.html hardcodes `<base href="/"/>` (no build-time
        # base-path option in its gulp release build), so every relative
        # asset/config fetch it makes would otherwise resolve against the
        # Portal's own root instead of /terria/. Rewrite it in flight instead
        # of forking TerriaMap's build. sub_filter can't see through gzip, and
        # terriajs-server compresses its static responses whenever a real
        # browser's Accept-Encoding offers it — strip that header so upstream
        # always sends plain text nginx can actually rewrite.
        proxy_set_header Accept-Encoding "";
        sub_filter 'base href="/"' 'base href="/terria/"';
        sub_filter_once on;
    }

    location ~ ^/stac/(?<path>.*)$ {
        set $upstream_stac stac-api:8080;
        proxy_pass http://$upstream_stac/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tiler/(?<path>.*)$ {
        set $upstream_titiler titiler:80;
        proxy_pass http://$upstream_titiler/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/cube/(?<path>.*)$ {
        set $upstream_cube cube:4000;
        proxy_pass http://$upstream_cube/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/dagster/(?<path>.*)$ {
        set $upstream_dagster dagster:3000;
        proxy_pass http://$upstream_dagster/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/auth/(?<path>.*)$ {
        set $upstream_keycloak keycloak:8083;
        proxy_pass http://$upstream_keycloak/$path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
