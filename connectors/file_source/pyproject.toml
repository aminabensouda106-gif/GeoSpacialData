[project]
name = "connectors-file-source"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "connectors-base",
  "shapely>=2.0",
  "boto3>=1.34",
  "pyarrow>=16",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors_file_source*"]
