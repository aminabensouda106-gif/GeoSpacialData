[project]
name = "connectors-gee-source"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "connectors-base",
  "numpy>=1.26",
  "rasterio>=1.3",
  "pystac>=1.10",
  "shapely>=2.0",
  "boto3>=1.34,<2",
  "requests>=2.31",
  "earthengine-api>=0.1.400",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors_gee_source*"]
