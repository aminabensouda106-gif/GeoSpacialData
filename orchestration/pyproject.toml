[project]
name = "platform-orchestration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.8,<2",
  "dagster-webserver>=1.8,<2",
  "dagster-postgres>=0.24",
  "pyiceberg[pyarrow,s3fs]>=0.7",
  "pyarrow>=16",
  "boto3>=1.34",
  "connectors-base",
  "connectors-api-source",
  "connectors-file-source",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_orchestration*"]
